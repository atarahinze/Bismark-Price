services:
  frontend:
    container_name: bismark_frontend
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    container_name: bismark_backend
    build:
      context: ./apps/backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://bismark:password@postgres:5432/bismark
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  postgres:
    container_name: bismark_postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bismark
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bismark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: bismark_redis
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:

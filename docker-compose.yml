services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bismark_app
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: bismark_price
      DB_USERNAME: bismark
      DB_PASSWORD: root
    volumes:
      - ./:/var/www/html
      - bismark_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bismark

  mysql:
    image: mysql:8.0
    container_name: bismark_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bismark_price
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bismark
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - bismark_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - bismark

  nginx:
    image: nginx:1.27-alpine
    container_name: bismark_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - bismark

networks:
  bismark:
    driver: bridge

volumes:
  bismark_mysql_data:
  bismark_vendor:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bismark_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bismark_price
      DB_USER: bismark
      DB_PASSWORD: root
      SESSION_SECRET: change-this-secret
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bismark

  mysql:
    image: mysql:8.0
    container_name: bismark_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bismark_price
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bismark
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - bismark_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - bismark

networks:
  bismark:
    driver: bridge

volumes:
  bismark_mysql_data:
